name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned static analyzers
        run: |
          tests/install-linters.sh "$RUNNER_TEMP/omazen-linters"
          echo "$RUNNER_TEMP/omazen-linters" >> "$GITHUB_PATH"

      - name: Run static analysis
        run: tests/lint.sh

      - name: Validate Bash and JavaScript syntax
        run: tests/syntax.sh

      - name: Run test suite
        run: tests/test.sh
