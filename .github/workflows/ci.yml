name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned static analyzers
        run: |
          tests/install-linters.sh "$RUNNER_TEMP/omazen-linters"
          echo "$RUNNER_TEMP/omazen-linters" >> "$GITHUB_PATH"

      - name: Run static analysis
        run: tests/lint.sh

      - name: Validate Bash and JavaScript syntax
        run: tests/syntax.sh

      - name: Run test suite
        run: tests/test.sh

      - name: Run WCAG palette contrast checks
        run: node tests/contrast.mjs

      - name: Check repository whitespace
        run: git diff --check

  visual:
    name: Rendered-pixel smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install visual test dependencies
        run: sudo apt-get update && sudo apt-get install --yes imagemagick libasound2t64 libdbus-glib-1-2 libgtk-3-0t64

      - name: Install verified Zen build
        env:
          ZEN_VERSION: 1.21.15b
          ZEN_SHA256: 2eaea664b840067ca0ace623bd4f4548fae98f46a98e2ddbdfdcb9253b674bbf
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zen.linux-x86_64.tar.xz"
          zen_root="$RUNNER_TEMP/zen"
          bin_root="$RUNNER_TEMP/bin"

          curl --fail --location --proto '=https' --retry 3 --silent --show-error \
            --output "$archive" \
            "https://github.com/zen-browser/desktop/releases/download/$ZEN_VERSION/zen.linux-x86_64.tar.xz"

          printf '%s  %s\n' "$ZEN_SHA256" "$archive" | sha256sum --check --status

          mkdir -p "$zen_root" "$bin_root"
          first_entry=$(tar -tf "$archive" | sed -n '1p')
          if [[ $first_entry == */* ]]; then
            tar --strip-components=1 -xf "$archive" -C "$zen_root"
          else
            tar -xf "$archive" -C "$zen_root"
          fi

          grep -Fqx -- "Version=$ZEN_VERSION" "$zen_root/application.ini"
          test -x "$zen_root/zen"
          ln -s "$zen_root/zen" "$bin_root/zen-browser"
          echo "$bin_root" >> "$GITHUB_PATH"

      - name: Run rendered-pixel smoke test
        env:
          OMAZEN_KEEP_VISUAL_OUTPUT: 1
          OMAZEN_VISUAL_OUTPUT_DIR: ${{ runner.temp }}/omazen-visual-output
        run: tests/visual-smoke.sh

      - name: Upload visual output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omazen-visual-smoke
          path: ${{ runner.temp }}/omazen-visual-output/
          if-no-files-found: ignore
