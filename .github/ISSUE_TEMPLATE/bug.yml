name: 🐛 Bug report
description: Report a problem with Omazen or its integration with Zen.
title: "[Bug]: "
labels:
  - bug
  - triage

body:
  - type: markdown
    attributes:
      value: |
        Before submitting a bug report:

        1. Reproduce the problem, then run `omazen report` (it creates a timestamped `.tar.gz` in the current directory).
        2. Attach the generated `.tar.gz` support package below. It includes sanitized `doctor --json` and `status` output, versions, the relevant bridge-log fragment, and installed-file hashes.
        3. If `doctor` reports missing Omazen-owned loader files, run `omazen setup` and generate the report again.
        4. The report replaces paths below your home directory with `$HOME` and does not include profile or palette contents. Review the archive before attaching it and remove any passwords, tokens, or other sensitive data.
        5. If the report command fails, include its complete terminal output and explain what prevented it from completing.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: "I searched for existing issues that describe the same problem."
          required: true
        - label: "I reproduced the problem and generated `omazen report` afterward."
          required: true
        - label: "I reviewed the support package and confirmed that it contains no passwords, tokens, or other sensitive data."
          required: true

  - type: textarea
    id: support_report
    attributes:
      label: Sanitized Omazen support report
      description: Attach the complete `.tar.gz` generated by `omazen report`. If the form does not accept file attachments, submit the issue and attach it in the first comment.
      placeholder: Drag omazen-report-*.tar.gz here, or write "Will attach in the first comment".
    validations:
      required: true

  - type: textarea
    id: doctor_output
    attributes:
      label: Human-readable doctor output (optional)
      description: Include this only when the issue concerns terminal formatting or colored statuses. The support report already contains the machine-readable diagnostics; remove secrets or personal paths before posting this optional output.
      placeholder: Paste the output of `omazen doctor` here if it adds relevant context.
      render: shell
    validations:
      required: false

  - type: input
    id: system
    attributes:
      label: System and Zen version
      description: Include your Omarchy version and Zen package/version if known.
      placeholder: Omarchy 4.x / zen-browser-bin 1.x

  - type: dropdown
    id: palette_provider
    attributes:
      label: Palette provider
      description: Select the provider reported by `omazen status` or `omazen doctor --json`.
      options:
        - Omarchy theme hook
        - External provider (`OMAZEN_SKIP_THEME_HOOK=1`)
        - Unknown
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the current behavior and what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Additional logs
      description: Optional; the support report already includes the relevant bridge-log fragment. Include extra output only when it adds context, and remove secrets before posting.
      render: shell
